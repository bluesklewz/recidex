<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Recipe Graph</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23EDE9E3'/%3E%3Cg fill='none' stroke='%2384172C' stroke-width='2'%3E%3Crect x='4' y='5' width='24' height='22'/%3E%3Cpath d='M4 12h14M4 19h14M18 5v22'/%3E%3C/g%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{
    /* ---- MindfulPalettes No.289 · 60 neutral / 30 primary / 10 accent ---- */
    --color-canvas:#EDE9E3;      /* warm-neutral ground */
    --color-surface:#FBF9F5;     /* card / panel, nod to Isabelline */
    --color-ink:#3F000F;         /* Berry Chocolate — near-black, warm */
    --color-ink-soft:#5F4A46;    /* secondary text */
    --color-ink-muted:#8F847C;   /* tertiary / meta */
    --color-hairline:#DDD5CC;    /* borders, rules */
    --color-primary:#84172C;     /* Sweet Cherry Red — display type + graph */
    --color-primary-soft:#B53D45;/* Pomegranate */
    --color-accent:#FAA21A;      /* Phoenix Flames — sparing interactive pop */
    --color-support:#A0B2C8;     /* Aerial View — quiet cool tint */
    --color-danger:#B53D45;

    /* the one rare pop: orange → burnt-red, used only on the primary button fill */
    --grad-accent:linear-gradient(118deg,#F7A81E 0%,#DF4A1B 55%,#C5341C 100%);

    /* weight-driven hierarchy (size does less of the work now) */
    --fw-body:400;
    --fw-medium:500;
    --fw-strong:600;
    --fw-display:800;

    /* soft separation to replace hard borders */
    --shadow-soft:0 8px 24px rgba(63,0,15,.08);
    --shadow-soft-lg:0 16px 40px rgba(63,0,15,.13);

    /* legacy aliases so existing rules keep resolving */
    --paper:var(--color-canvas);
    --paper-2:#E3DFD7;
    --paper-3:var(--color-surface);
    --ink:var(--color-ink);
    --ink-60:var(--color-ink-soft);
    --ink-30:var(--color-ink-muted);
    --red:var(--color-primary);
    --green:var(--color-primary);
    --hair:var(--color-hairline);

    --font-ui:'Inter',-apple-system,'Helvetica Neue',Arial,sans-serif;
    --font-mono:'Inter Tight','Inter',-apple-system,sans-serif;

    --space-1:4px; --space-2:8px; --space-3:16px; --space-4:24px;
    --space-5:32px; --space-6:48px; --space-7:64px; --space-8:96px;
    --space:clamp(1.5rem,4vw,3rem);

    --radius:2px;
    --shadow-panel:0 1px 2px rgba(63,0,15,.05),0 12px 32px rgba(63,0,15,.06);
    --shadow-float:0 3px 10px rgba(63,0,15,.07),0 30px 70px rgba(63,0,15,.12);
    font-synthesis:none;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  html{scroll-behavior:smooth}
  body{
    background:var(--color-canvas);
    color:var(--color-ink);
    font-family:var(--font-ui);
    font-size:15px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  h1,h2,h3,h4{font-family:var(--font-ui);font-weight:var(--fw-display);letter-spacing:-.03em;line-height:1.05}
  h3,h4{font-weight:var(--fw-strong);letter-spacing:-.015em}
  .u-label{font-size:13px;color:var(--color-ink-muted);letter-spacing:0;font-weight:var(--fw-body)}
  .mono{font-family:var(--font-mono)}
  button{font-family:inherit;color:inherit;cursor:pointer;background:none;border:0}
  a{color:var(--color-primary);text-decoration:none}
  a:hover{text-decoration:underline}
  ::selection{background:var(--color-primary);color:var(--color-surface)}

  /* the old striped brutalist face is retired — this is now a quiet primary-colored display heading */
  .striped{
    font-family:var(--font-ui);font-weight:var(--fw-display);letter-spacing:-.035em;
    color:var(--color-primary);display:inline-block;line-height:1.0;
  }
  .striped.sm{font-weight:var(--fw-strong);letter-spacing:-.01em;font-size:1.02rem;color:var(--color-ink)}

  /* ---------- shell ---------- */
  #app{position:relative;z-index:1;min-height:100%}
  .topbar{
    position:fixed;top:0;left:0;right:0;z-index:60;
    display:flex;align-items:center;justify-content:space-between;gap:1rem;
    padding:var(--space-3) var(--space);
    background:color-mix(in srgb,var(--color-canvas) 88%,transparent);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--color-hairline);
  }
  .topbar .brand{cursor:pointer}
  .topbar nav{display:flex;align-items:center;gap:var(--space-2)}
  .pill{
    border:1px solid var(--color-hairline);background:transparent;color:var(--color-ink-soft);
    padding:9px 16px;font-size:13px;font-weight:500;border-radius:var(--radius);
    transition:background .18s ease,color .18s ease,border-color .18s ease,transform .18s ease;
  }
  .pill:hover{background:var(--color-ink);color:var(--color-surface);border-color:var(--color-ink)}
  .pill:active{transform:translateY(1px)}
  .pill:focus-visible{outline:2px solid var(--color-primary);outline-offset:2px}
  .pill.red{border:0;color:#fff;background:var(--grad-accent);font-weight:var(--fw-strong)}
  .pill.red:hover{background:var(--grad-accent);color:#fff;filter:brightness(1.05)}
  .pill.red:active{filter:brightness(.95)}
  .pill.ghost{border-color:var(--color-hairline);background:transparent;color:var(--color-ink-soft)}
  .pill.ghost:hover{border-color:var(--color-ink);background:var(--color-ink);color:var(--color-surface)}

  /* ============ LIBRARY (frontal cascade↔ring layout engine) ============ */
  .ring-view{position:relative;min-height:100vh;padding-top:3.4rem;overflow:hidden}
  .ring-meta{position:absolute;left:var(--space);top:5rem;z-index:5;max-width:16rem}
  .ring-meta .count{font-size:13px;letter-spacing:0;color:var(--color-ink-muted)}
  .ring-stage{
    position:absolute;inset:0;overflow:hidden;
    touch-action:none;cursor:grab;
  }
  .ring-stage:active{cursor:grabbing}
  /* frontal — no perspective, no rotateX/Y: cards face the viewer directly.
     .ring is just a flat positioning root; every child's transform is a
     plain 2D translate written every frame by the JS layout engine. */
  .ring{position:absolute;inset:0}
  .orbit{
    position:absolute;left:0;top:0;
    will-change:transform;transition:opacity .32s ease;
  }
  .idx-card{
    width:100%;height:100%;background:var(--color-surface);
    border-radius:var(--radius);
    padding:var(--space-2) var(--space-3);
    display:flex;flex-direction:column;justify-content:space-between;gap:var(--space-1);
    cursor:pointer;position:relative;overflow:hidden;
    box-shadow:var(--shadow-soft);
    transition:transform .2s cubic-bezier(.2,.8,.2,1),box-shadow .2s ease;
  }
  .idx-card:hover{transform:scale(1.045);box-shadow:var(--shadow-soft-lg);z-index:5}
  .idx-card .bn{font-family:var(--font-mono);font-size:11px;letter-spacing:0;color:var(--color-ink-muted)}
  .idx-card .bn b{color:var(--color-ink-soft);font-weight:var(--fw-medium)}
  .idx-card .nm{font-family:var(--font-ui);font-weight:var(--fw-strong);
    font-size:14px;line-height:1.15;letter-spacing:-.015em;color:var(--color-ink);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .idx-card .tg{font-size:10.5px;letter-spacing:0;color:var(--color-ink-muted);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ring-empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;text-align:center;gap:1rem;padding:2rem;z-index:9}

  /* center hover-reveal — only shown once the ring is (near) assembled */
  .ring-preview{
    position:absolute;left:50%;top:50%;z-index:50;
    width:min(60vw,340px);
    background:var(--color-surface);border-radius:var(--radius);box-shadow:var(--shadow-soft-lg);
    padding:var(--space-3);cursor:pointer;pointer-events:none;
    transform:translate(-50%,-50%) scale(.9);opacity:0;
    transition:opacity .2s ease-out,transform .2s ease-out;
  }
  .ring-preview.show{opacity:1;transform:translate(-50%,-50%) scale(1);pointer-events:auto}
  .ring-preview .pv-name{font-family:var(--font-ui);font-weight:var(--fw-strong);font-size:14px;
    margin-bottom:.5rem;color:var(--color-ink);letter-spacing:-.01em}
  .ring-preview .graph-wrap{overflow:visible}

  /* auto-assemble toggle + zoom, grouped near the filter dock (top-right, mirrors .ring-meta) */
  .lib-controls{
    position:fixed;right:var(--space);top:5rem;z-index:41;
    display:flex;flex-direction:column;gap:.6rem;
    background:var(--color-surface);border:1px solid var(--color-hairline);border-radius:var(--radius);
    padding:.65rem .8rem;box-shadow:var(--shadow-panel);
  }
  .lib-controls .row{display:flex;align-items:center;justify-content:space-between;gap:.9rem}
  .lib-controls .row-label{font-size:12px;letter-spacing:0;color:var(--color-ink-soft)}
  .switch{
    width:32px;height:18px;border-radius:999px;background:var(--color-hairline);
    position:relative;flex:none;transition:background .18s ease;border:0;
  }
  .switch .knob{
    position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;
    background:var(--color-surface);box-shadow:0 1px 2px rgba(0,0,0,.2);
    transition:transform .18s cubic-bezier(.2,.8,.2,1);
  }
  .switch.on{background:var(--grad-accent)}
  .switch.on .knob{transform:translateX(14px)}
  .zoom-group{display:flex;align-items:center;gap:.4rem}
  .zoom-btn{
    width:20px;height:20px;border-radius:50%;background:var(--color-canvas);
    color:var(--color-ink-soft);font-size:13px;line-height:1;display:flex;align-items:center;justify-content:center;
  }
  .zoom-btn:hover{background:var(--color-hairline);color:var(--color-ink)}
  .zoom-label{font-family:var(--font-mono);font-size:11px;color:var(--color-ink-muted);min-width:2.6em;text-align:center}

  /* filter dock — design-system ranked category list */
  .filter-dock{
    position:fixed;right:var(--space);bottom:var(--space);z-index:40;
    width:min(84vw,15rem);background:var(--color-surface);
    border:1px solid var(--color-hairline);border-radius:var(--radius);
    padding:var(--space-3);box-shadow:var(--shadow-panel);
  }
  .filter-dock h4{font-size:13px;font-weight:500;letter-spacing:0;margin-bottom:var(--space-3);
    display:flex;justify-content:space-between;align-items:baseline}
  .filter-dock h4 span{font-family:var(--font-mono);font-weight:400;color:var(--color-ink-muted);font-size:12px}
  .tag-search{width:100%;border:0;border-bottom:1px solid var(--color-hairline);background:transparent;
    font-family:inherit;font-size:13px;padding:.35rem 0;margin-bottom:var(--space-3);color:var(--color-ink)}
  .tag-search::placeholder{color:var(--color-ink-muted)}
  .tag-search:focus{outline:none;border-color:var(--color-primary)}
  .tag-list{display:flex;flex-direction:column;gap:2px;max-height:38vh;overflow:auto}
  .tag-chip{
    position:relative;border:0;background:transparent;padding:.28rem 0 .28rem 14px;text-align:left;
    font-size:13px;letter-spacing:0;color:var(--color-ink-muted);
    display:flex;justify-content:space-between;align-items:baseline;gap:.5rem;
    transition:color .15s ease;
  }
  .tag-chip:hover{color:var(--color-ink)}
  .tag-chip b{font-family:var(--font-mono);font-weight:400;font-size:10px;color:var(--color-ink-muted)}
  .tag-chip.on{color:var(--color-primary);font-weight:500}
  .tag-chip.on::before{content:"";position:absolute;left:0;top:.62em;width:5px;height:5px;background:var(--color-accent)}
  .tag-chip.on b{color:var(--color-primary)}
  .filter-clear{margin-top:var(--space-3);font-size:12px;letter-spacing:0;color:var(--color-ink-soft);
    background:none;border:0;border-bottom:1px solid var(--color-hairline);padding:0 0 1px}
  .filter-clear:hover{color:var(--color-ink);border-bottom-color:var(--color-ink)}

  /* ============ GENERATOR ============ */
  .gen{max-width:60rem;margin:0 auto;padding:var(--space-8) var(--space) var(--space-7);display:grid;gap:var(--space-5)}
  .gen h1{font-size:clamp(2rem,5vw,3.25rem);font-weight:var(--fw-display);letter-spacing:-.035em}
  .gen .lede{max-width:56ch;color:var(--color-ink-soft);font-size:16px;line-height:1.6}
  .gen-grid{display:grid;gap:var(--space-4);grid-template-columns:1fr 1fr}
  .field{display:grid;gap:var(--space-2)}
  .field.full{grid-column:1/-1}
  .field label{font-size:13px;font-weight:500;letter-spacing:0;color:var(--color-ink)}
  .field .hint{font-size:13px;color:var(--color-ink-muted);letter-spacing:0;font-weight:400}
  .field input,.field textarea{
    width:100%;background:var(--color-surface);border:1px solid var(--color-hairline);border-radius:var(--radius);
    font-family:inherit;font-size:14px;padding:.6rem .7rem;color:inherit;resize:vertical;
  }
  .field textarea{min-height:11rem;line-height:1.7;font-family:var(--font-mono)}
  .field input:focus,.field textarea:focus{outline:none;border-color:var(--color-primary);
    box-shadow:0 0 0 3px color-mix(in srgb,var(--color-primary) 12%,transparent)}
  .gen-actions{display:flex;gap:var(--space-2);align-items:center;flex-wrap:wrap}
  .gen-preview{border-top:1px solid var(--color-hairline);padding-top:var(--space-4);display:grid;gap:var(--space-3)}
  .gen-preview .u-label{color:var(--color-ink-muted)}

  /* ============ GRAPH ============ */
  .graph-wrap{overflow-x:auto;padding-bottom:.2rem}
  .graph{
    display:grid;justify-content:start;background:var(--color-surface);
    border:1px solid var(--color-primary);border-radius:var(--radius);
    width:max-content;font-family:var(--font-mono);
  }
  .graph .g-banner{
    grid-column:1/-1;border-bottom:1px solid var(--color-primary);
    text-align:center;padding:.42rem .6rem;font-size:13px;color:var(--color-ink-soft);
  }
  .graph .g-ing{
    grid-column:1/2;border-bottom:1px solid var(--color-primary);border-right:1px solid var(--color-primary);
    padding:.34rem .6rem;font-size:13px;display:flex;align-items:center;color:var(--color-ink);
  }
  .graph .g-cell{
    border:1px solid var(--color-primary);margin:-0.5px 0 0 -0.5px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
    padding:.3rem .5rem;font-size:12.5px;line-height:1.15;min-width:2.9rem;color:var(--color-ink);
  }
  .graph .g-cell{max-width:11rem}
  .graph .g-cell>span:first-child{white-space:nowrap}
  .graph .g-cell .det{display:flex;flex-direction:column;align-items:center;gap:.05rem;
    font-size:10.5px;color:var(--color-ink-muted);margin-top:.24rem;font-style:normal}
  .graph .g-cell .det i{font-style:normal;white-space:nowrap}
  .graph.mini{transform-origin:top left;border-width:1px}
  .graph.mini .g-banner,.graph.mini .g-ing,.graph.mini .g-cell{font-size:10.5px;padding:.2rem .32rem;min-width:2.4rem}

  /* the printable artifact card */
  .flip{
    perspective:1800px;width:min(100%,600px);
  }
  .flip-inner{
    display:grid;width:100%;transition:transform .8s cubic-bezier(.6,.05,.2,1);
    transform-style:preserve-3d;cursor:pointer;
  }
  .flip.flipped .flip-inner{transform:rotateY(180deg)}
  .flip-face{
    grid-area:1/1;width:100%;overflow:hidden;
    backface-visibility:hidden;-webkit-backface-visibility:hidden;
    background:var(--color-surface);border:1px solid var(--color-hairline);border-radius:var(--radius);
    box-shadow:var(--shadow-float);
    display:flex;flex-direction:column;
  }
  .flip-face.back{transform:rotateY(180deg)}
  .card-head,.card-foot{flex:none}
  .card-body{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center}
  .card-head{
    display:flex;justify-content:space-between;align-items:center;gap:1rem;
    padding:var(--space-3);border-bottom:1px solid var(--color-hairline);
  }
  .card-head .ch-name{font-family:var(--font-ui);font-weight:var(--fw-strong);
    font-size:16px;letter-spacing:-.02em;line-height:1.1}
  .card-head .ch-bn{font-family:var(--font-mono);font-weight:400;font-size:12px;letter-spacing:0;color:var(--color-ink-muted);white-space:nowrap}
  .card-head .ch-bn b{color:var(--color-primary);font-weight:500}
  .card-body{padding:var(--space-4);min-width:0;width:100%;overflow:hidden}
  .card-foot{padding:var(--space-2) var(--space-3);border-top:1px solid var(--color-hairline);
    font-size:11px;letter-spacing:0;color:var(--color-ink-muted);
    display:flex;justify-content:space-between;gap:1rem}
  .flip-hint{margin-top:var(--space-3);font-size:12px;letter-spacing:0;color:var(--color-ink-muted)}

  /* label (card back) */
  .label{padding:var(--space-5);display:flex;flex-direction:column;justify-content:space-between;
    gap:.4rem;flex:1;position:relative;min-height:16rem;background:var(--color-surface)}
  .label hr{width:100%}
  .label .l-top{display:flex;align-items:flex-start;gap:1rem;justify-content:space-between}
  .label .l-name{font-family:var(--font-ui);font-weight:var(--fw-display);
    font-size:clamp(1.4rem,4vw,2.1rem);letter-spacing:-.035em;line-height:.95;color:var(--color-ink);text-transform:uppercase}
  .label .l-batch{font-family:var(--font-mono);font-size:11px;letter-spacing:0;
    text-align:right;padding-left:1rem;border-left:1px solid var(--color-ink);white-space:nowrap;color:var(--color-ink-soft)}
  .label .l-batch b{display:block;font-size:1.5rem;line-height:1;color:var(--color-primary);letter-spacing:0;margin-top:.2rem;font-weight:600}
  .label hr{border:0;border-top:1px solid var(--color-ink);margin:.55rem 0}
  .label .l-row{display:flex;justify-content:space-between;gap:1rem;align-items:flex-start}
  .label .l-yield{font-family:var(--font-mono);font-size:13px;letter-spacing:0;color:var(--color-ink)}
  .label .l-stat{display:flex;gap:.7rem;align-items:baseline}
  .label .l-stat .big{font-family:var(--font-ui);font-weight:600;font-size:1.5rem;letter-spacing:-.025em}
  .label .l-stat .cap{font-size:10.5px;letter-spacing:0;line-height:1.2;color:var(--color-ink-soft)}
  .label .l-diet{font-size:10.5px;letter-spacing:0;line-height:1.25;
    text-align:right;padding-left:.9rem;border-left:1px solid var(--color-ink);color:var(--color-ink-soft)}
  .label .l-ing h5{font-size:11px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:.5rem;font-weight:600;color:var(--color-ink-soft)}
  .label .l-ing p{font-size:12px;letter-spacing:0;line-height:1.5;padding-right:3.5rem;color:var(--color-ink)}
  .label .l-mark{position:absolute;right:1.4rem;bottom:1.3rem;width:52px;height:52px}

  /* ============ RECIPE VIEW ============ */
  .rv{position:relative;min-height:100vh;overflow:hidden}
  .rv-ghost{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
  .rv-ghost .blob,.rv-ghost .word{display:none}
  .rv-grid{
    position:relative;z-index:1;display:grid;gap:clamp(1.5rem,3vw,2.6rem);
    grid-template-columns:minmax(180px,17%) minmax(0,1fr) minmax(300px,32%);
    padding:var(--space-7) var(--space) var(--space-8);min-height:100vh;align-items:start;
  }
  .rv-list{position:sticky;top:5rem;max-height:calc(100vh - 7rem);display:flex;flex-direction:column;gap:.6rem}
  .rv-list .back{align-self:flex-start;margin-bottom:.5rem}
  .rv-list .scroll{overflow-y:auto;display:flex;flex-direction:column;gap:.3rem;padding-right:.3rem}
  .rv-list .r-item{
    text-align:left;background:none;border:0;padding:.2rem 0;
    font-family:var(--font-ui);font-weight:400;letter-spacing:0;
    font-size:14px;line-height:1.25;color:var(--color-ink-muted);
    transition:color .15s ease,transform .15s ease;
  }
  .rv-list .r-item:hover{color:var(--color-ink);transform:translateX(2px)}
  .rv-list .r-item.on{color:var(--color-ink);font-weight:500;font-size:15px;line-height:1.2;
    display:flex;gap:.4rem;align-items:baseline}
  .rv-list .r-item.on::before{content:"";width:5px;height:5px;background:var(--color-accent);flex:none;transform:translateY(-1px)}

  .rv-main{display:grid;gap:var(--space-3);justify-items:start;max-width:620px;min-width:0}
  .rv-title{font-size:clamp(1.6rem,3.6vw,2.5rem);margin-top:.3rem;max-width:100%;font-weight:var(--fw-display)}
  .rv-squiggle{display:none}
  .rv-tags{display:flex;flex-direction:column;gap:.2rem}
  .rv-tags .t{font-size:12px;letter-spacing:0;color:var(--color-ink-muted);
    display:flex;align-items:center;gap:.45rem}
  .rv-tags .t::before{content:"";width:4px;height:4px;background:var(--color-primary);flex:none}

    font-family:var(--font-mono);font-size:13px;line-height:1.7;padding:.7rem;resize:vertical;color:var(--color-ink)}

    .ring-preview,.lib-controls{display:none !important}
    .ring{position:static !important;display:flex;flex-direction:column;gap:.8rem;width:auto;height:auto;transform:none !important}
    .orbit{position:static !important;transform:none !important;width:100% !important;height:auto !important;
      margin:0 !important;opacity:1 !important;transition:none}
    .idx-card{height:auto;padding:var(--space-3);gap:.4rem}
    .idx-card .nm{font-size:1rem}
    .idx-card .tg{white-space:normal}
    .ring-meta{position:static;max-width:none;margin:0 var(--space) 1.2rem}
    .filter-dock{position:static;width:auto;margin:1.4rem var(--space) 0;box-shadow:none}
    .tag-list{max-height:none}
    .ring-empty{position:static;min-height:50vh}

  }

  }

<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";
/* ============================================================ store */
var KEY="recipe-graph.v1";
function uid(){return Math.random().toString(36).slice(2,9)}
function load(){
  try{var d=JSON.parse(localStorage.getItem(KEY));if(d&&d.recipes)return d;}catch(e){}
  return null;
}
function save(){localStorage.setItem(KEY,JSON.stringify(DB));}
var DB=load()||seed();

function seed(){
  var _n=0;
  var mk=function(o){o.id="r"+(++_n);o.createdAt=Date.now()+_n;return o;};
  var db={recipes:[
    mk({title:"Espresso Brownies",sourceUrl:"",yield:"Makes 16 squares",totalTime:"50 min",activeTime:"15 min",
      tags:["dessert","chocolate","vegetarian","weekend"],
      ingredients:["4 oz unsalted butter","1 cup sugar","1/4 tsp vanilla extract","1 shot fresh brewed espresso",
        "2 large eggs","1/2 cup all-purpose flour","1/3 cup cocoa powder","1/4 tsp baking soda","1/4 tsp table salt"],
      steps:["Butter and flour an 8x8-in pan","Preheat oven to 350°F (170°C)","Melt the butter",
        "Mix in the sugar, vanilla, and espresso","Mix in the eggs",
        "Whisk together the flour, cocoa powder, baking soda, and salt in a separate bowl",
        "Fold the dry ingredients into the wet","Bake at 350°F for 30 to 40 minutes"]}),
    mk({title:"Weeknight Miso Ramen",sourceUrl:"",yield:"Serves 2",totalTime:"25 min",activeTime:"25 min",
      tags:["dinner","soup","quick","vegetarian"],
      ingredients:["1 tbsp sesame oil","2 cloves garlic, minced","1 tbsp grated ginger","3 tbsp white miso",
        "4 cups vegetable broth","2 portions ramen noodles","2 soft-boiled eggs","2 cups baby spinach","2 scallions, sliced"],
      steps:["Heat the sesame oil in a pot","Cook the garlic and ginger until fragrant",
        "Stir in the miso to form a paste","Pour in the vegetable broth and bring to a simmer",
        "Cook the ramen noodles in the broth for 3 minutes","Fold in the spinach until wilted",
        "Serve topped with the eggs and scallions"]}),
    mk({title:"No-Knead Country Loaf",sourceUrl:"",yield:"1 large loaf",totalTime:"18 hr",activeTime:"20 min",
      tags:["bread","vegan","make-ahead","weekend"],
      ingredients:["500 g bread flour","10 g fine sea salt","1 g instant yeast","375 g cool water","10 g rice flour for dusting"],
      steps:["Whisk together the bread flour, salt, and yeast","Mix in the water until no dry flour remains",
        "Rest the dough covered for 14 hours at room temperature","Roll the dough into a taut round",
        "Rest the shaped dough for 2 hours","Bake in a covered pot at 475°F for 45 minutes"]}),
    mk({title:"Chopped Winter Salad",sourceUrl:"",yield:"Serves 4",totalTime:"15 min",activeTime:"15 min",
      tags:["salad","vegan","gluten-free","quick"],
      ingredients:["3 tbsp olive oil","1 tbsp cider vinegar","1 tsp maple syrup","1/2 tsp dijon mustard",
        "1 head radicchio, chopped","2 apples, diced","1/2 cup toasted walnuts","1/3 cup dried cranberries"],
      steps:["Whisk together the olive oil, vinegar, maple syrup, and mustard",
        "Toss the radicchio and apples with the dressing","Fold in the walnuts and cranberries",
        "Rest 5 minutes before serving"]}),
    mk({title:"Almond Sea Salt Bark",sourceUrl:"",yield:"60 grams per piece",totalTime:"40 min",activeTime:"15 min",
      tags:["dessert","chocolate","vegan","gluten-free"],
      ingredients:["200 g bittersweet chocolate","1/2 cup roasted almonds","1 tsp flaky sea salt"],
      steps:["Melt the bittersweet chocolate over a double boiler","Stir in half of the almonds",
        "Pour the chocolate onto a lined sheet","Sprinkle with the remaining almonds and the sea salt",
        "Chill until set, about 20 minutes"]}),
    mk({title:"Charred Scallion Fried Rice",sourceUrl:"",yield:"Serves 3",totalTime:"20 min",activeTime:"20 min",
      tags:["dinner","quick","vegetarian"],
      ingredients:["2 tbsp neutral oil","6 scallions, cut in batons","3 cups day-old rice","2 eggs, beaten",
        "2 tbsp soy sauce","1 tsp toasted sesame oil","1/2 tsp white pepper"],
      steps:["Heat the neutral oil until shimmering","Cook the scallions until charred at the edges",
        "Stir in the rice and press into the pan","Push the rice aside and scramble the eggs",
        "Mix in the soy sauce, sesame oil, and white pepper","Serve immediately"]})
  ]};
  return db;
}

/* ============================================================ parser */
var UNITS="cups?|tsp|teaspoons?|tbsp|tablespoons?|oz|ounces?|lb|lbs|pounds?|g|grams?|kg|ml|l|liters?|litres?|pinch(?:es)?|dash(?:es)?|cloves?|sticks?|cans?|jars?|slices?|sprigs?|handfuls?|bunch(?:es)?|pieces?|portions?|heads?|packages?|pkg|shots?|quarts?|pints?";
var QTY=new RegExp("^\\s*((?:\\d+\\s+)?\\d+(?:[\\/.]\\d+)?|[¼½¾⅓⅔⅛⅜⅝⅞])(?:\\s*(?:"+UNITS+")\\b)?\\.?\\s*(?:\\([^)]*\\)\\s*)?","i");
var STOP={fresh:1,large:1,small:1,medium:1,chopped:1,minced:1,diced:1,sliced:1,grated:1,ground:1,
  unsalted:1,salted:1,extract:1,powder:1,all:1,purpose:1,very:1,strong:1,into:1,the:1,and:1,or:1,
  room:1,temperature:1,softened:1,melted:1,plus:1,more:1,for:1,packed:1,sifted:1,toasted:1,roasted:1,
  dried:1,fine:1,flaky:1,cool:1,cold:1,warm:1,hot:1,day:1,old:1,taut:1,fresh:1,brewed:1,instant:1,
  boiled:1,soft:1,baby:1,white:1,neutral:1,dusting:1,cut:1,batons:1,beaten:1,head:1};
var VERBS={preheat:"preheat",heat:"heat",warm:"warm",melt:"melt",mix:"mix",combine:"combine",
  whisk:"whisk",beat:"beat",cream:"cream",stir:"stir",fold:"fold in",add:"add",pour:"pour",
  sift:"sift",sprinkle:"sprinkle",scatter:"add",top:"top",bake:"bake",cook:"cook",simmer:"simmer",
  boil:"boil",roast:"roast",bring:"bring to a boil",chill:"chill",refrigerate:"chill",freeze:"freeze",
  rest:"rest",proof:"proof",cool:"cool",knead:"knead",roll:"shape",shape:"shape",spread:"spread",
  transfer:"transfer",divide:"divide",grease:"prep",butter:"prep",line:"prep",prepare:"prep",
  season:"season",grate:"grate",dissolve:"dissolve",temper:"temper",blend:"blend",puree:"blend",
  drain:"drain",toss:"toss",marinate:"marinate",garnish:"garnish",serve:"serve",scramble:"scramble",
  push:"cook",press:"cook",reduce:"reduce",deglaze:"deglaze",saute:"sauté"};
var PREP=/^(butter|flour|grease|line|preheat|prepare)\b|pan\b|oven\b|sheet pan|baking sheet|double boiler/i;
var JOIN=/^(fold|combine|add|pour|stir|mix|whisk|incorporate|top|scatter|sprinkle)/;
var SEP=/separate bowl|another bowl|second bowl|different bowl|small bowl|large bowl(?!.*wilt)/i;
var MIX_REF=/\b(the|mixture|batter|dough|wet|dry|creamed|reserved|remaining|paste|sauce|pan|pot|broth|noodles|it)\b/i;

function parseIng(line){
  line=line.replace(/^[\s\-•*]+/,"").trim();
  if(!line) return null;
  var m=QTY.exec(line);
  var qty="",name=line;
  if(m&&m[0].trim()&&/\d|[¼-⅞]/.test(m[0])){qty=m[0].trim();name=line.slice(m[0].length).trim();}
  if(!name){name=line;qty="";}
  name=name.replace(/^of\s+/i,"");
  var words=name.toLowerCase().replace(/[(),.'";]/g," ").split(/\s+/).filter(Boolean);
  var kw=words.filter(function(w){return w.length>=3&&!STOP[w];});
  if(words.length){var last=words[words.length-1].replace(/s$/,"");if(last.length>=3&&kw.indexOf(last)<0)kw.push(last);}
  kw=kw.map(function(w){return w.replace(/s$/,"");});
  return {raw:line,qty:qty,name:name,kw:kw};
}
function verbOf(text){
  var ws=text.toLowerCase().replace(/[^a-z\s]/g," ").split(/\s+/).filter(Boolean);
  for(var i=0;i<Math.min(ws.length,4);i++){if(VERBS[ws[i]])return {key:ws[i],label:VERBS[ws[i]]};}
  return {key:ws[0]||"step",label:ws[0]||"step"};
}
function detail(text){
  var t=text.replace(/[–—]/g,"-");
  var temp=t.match(/\d{2,3}\s?°?\s?[FC]\b/i);
  var time=t.match(/\d+\s?(?:to|-)\s?\d+\s?(?:min|minutes|hr|hours?)|\d+\s?(?:min|minutes|hours?|hr)\b/i);
  var out=[];
  if(temp)out.push(temp[0].replace(/\s+/g,"").replace(/°?([FC])/i,"°$1"));
  if(time)out.push(time[0].replace(/\s+/g," ").replace(/\s?to\s?/,"-").replace(/minutes?/i,"min").replace(/hours?/i,"hr"));
  return out;
}

function buildGraph(recipe){
  var ings=(recipe.ingredients||[]).map(parseIng).filter(Boolean);
  var rawSteps=(recipe.steps||[]).map(function(s){return (s||"").trim();}).filter(Boolean);
  var steps=rawSteps.map(function(t){var v=verbOf(t);return {text:t,verb:v.label,vkey:v.key,det:detail(t)};});

  // assign ingredients to first matching step
  var assign=steps.map(function(){return [];});
  var used=steps.map(function(){return false;});
  var firstConsuming=-1;
  ings.forEach(function(ing){
    for(var j=0;j<steps.length;j++){
      if(steps[j].verb==="prep"||steps[j].verb==="preheat") continue;
      var lt=steps[j].text.toLowerCase();
      if(ing.kw.some(function(k){return lt.indexOf(k)>=0;})){assign[j].push(ing);ing._a=true;if(firstConsuming<0)firstConsuming=j;return;}
    }
  });
  var leftover=ings.filter(function(i){return !i._a;});
  if(leftover.length){
    var t=firstConsuming<0?0:firstConsuming;
    // find first non-banner step
    if(firstConsuming<0){for(var k=0;k<steps.length;k++){if(steps[k].verb!=="prep"&&steps[k].verb!=="preheat"){t=k;break;}}}
    assign[t]=leftover.concat(assign[t]);
  }

  var rows=[],groups=[],cells=[],banners=[];
  steps.forEach(function(s,j){
    var isBanner=(s.verb==="prep"||s.verb==="preheat")&&assign[j].length===0;
    if(isBanner&&groups.length===0){banners.push(s.text);return;}
    var newIngs=assign[j];
    var start=rows.length;
    newIngs.forEach(function(x){rows.push(x);});
    var end=rows.length-1;
    var isSep=SEP.test(s.text);
    var inputs=[];
    if(!isSep){
      if(groups.length>=2&&/^(fold|combine|add|pour|stir|mix|whisk)/.test(s.verb)){
        inputs=groups.splice(0);
      }else if(groups.length>=1&&(newIngs.length===0||MIX_REF.test(s.text)||JOIN.test(s.verb))){
        inputs=[groups.pop()];
      }
    }
    var ranges=inputs.map(function(g){return [g.s,g.e];});
    if(newIngs.length)ranges.push([start,end]);
    if(!ranges.length){
      if(groups.length){var g=groups.pop();inputs=[g];ranges=[[g.s,g.e]];}
      else return;
    }
    var r0=Math.min.apply(null,ranges.map(function(r){return r[0];}));
    var r1=Math.max.apply(null,ranges.map(function(r){return r[1];}));
    // column = one past the deepest input stream (fresh/parallel streams start at 0)
    var cc=inputs.length?Math.max.apply(null,inputs.map(function(g){return g.col;}))+1:0;
    var inputCells=inputs.map(function(g){return g.cellIdx;}).filter(function(x){return x>=0;});
    cells.push({col:cc,r0:r0,r1:r1,label:s.verb,det:s.det,ins:inputCells});
    groups.push({s:r0,e:r1,col:cc,cellIdx:cells.length-1});
  });
  if(groups.length>1){
    var gr0=Math.min.apply(null,groups.map(function(g){return g.s;}));
    var gr1=Math.max.apply(null,groups.map(function(g){return g.e;}));
    var gc=Math.max.apply(null,groups.map(function(g){return g.col;}))+1;
    cells.push({col:gc,r0:gr0,r1:gr1,label:"combine",det:"",ins:groups.map(function(g){return g.cellIdx;}).filter(function(x){return x>=0;})});
  }
  if(!rows.length){ // degenerate: no matched ingredients
    rows=ings.slice();
    if(rows.length)cells.push({col:0,r0:0,r1:rows.length-1,label:steps.length?steps[steps.length-1].verb:"combine",det:""});
  }
  // widen a shallow stream's cell so it reaches the step that consumes it (fills dead channels)
  cells.forEach(function(c,ci){
    var consumer=null;
    cells.forEach(function(d){if(d.ins&&d.ins.indexOf(ci)>=0)consumer=d;});
    c.colEnd=consumer&&consumer.col>c.col+1?consumer.col-1:c.col;
  });
  var nCols=cells.reduce(function(m,c){return Math.max(m,c.colEnd+1);},1);
  return {rows:rows,cells:cells,banners:banners,nCols:nCols,steps:steps,ings:ings};
}

/* ============================================================ render helpers */
function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e;}
function slug(s){return (s||"recipe").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");}
function batchNo(r){var i=DB.recipes.findIndex(function(x){return x.id===r.id;});return String((i<0?DB.recipes.length:i)+1).padStart(3,"0");}
function toast(msg){var t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(function(){t.classList.remove("show");},1800);}

function renderGraph(recipe,opts){
  opts=opts||{};
  var g=buildGraph(recipe);
  var wrap=el("div","graph-wrap");
  var grid=el("div","graph"+(opts.mini?" mini":""));
  var nb=g.banners.length;
  grid.style.gridTemplateColumns="minmax("+(opts.mini?"90px":"150px")+",1fr) repeat("+Math.max(g.nCols,1)+",minmax("+(opts.mini?"2rem":"3.2rem")+",max-content))";
  grid.style.gridTemplateRows="repeat("+nb+",auto) repeat("+Math.max(g.rows.length,1)+",auto)";
  g.banners.forEach(function(b,i){
    var d=el("div","g-banner",b);d.style.gridRow=(i+1)+" / "+(i+2);grid.appendChild(d);
  });
  g.rows.forEach(function(ing,i){
    var d=el("div","g-ing");
    d.style.gridRow=(nb+i+1)+" / "+(nb+i+2);d.style.gridColumn="1 / 2";
    d.textContent=(ing.qty?ing.qty+" ":"")+ing.name;
    grid.appendChild(d);
  });
  g.cells.forEach(function(c){
    var d=el("div","g-cell");
    d.style.gridRow=(nb+c.r0+1)+" / "+(nb+c.r1+2);
    d.style.gridColumn=(c.col+2)+" / "+((c.colEnd==null?c.col:c.colEnd)+3);
    d.appendChild(el("span",null,c.label));
    if(c.det&&c.det.length&&!opts.mini){
      var dd=el("span","det");
      c.det.forEach(function(x){dd.appendChild(el("i",null,x));});
      d.appendChild(dd);
    }
    grid.appendChild(d);
  });
  wrap.appendChild(grid);
  return wrap;
}

function fitGraph(wrap,avail,maxH){
  var g=wrap.firstChild;if(!g||!avail)return;
  g.style.transform="";wrap.style.width="";wrap.style.height="";
  var nw=g.scrollWidth,nh=g.scrollHeight;
  g._nw=nw;g._nh=nh;
  var s=Math.min((avail-10)/nw,maxH?maxH/nh:1,1);
  g._scale=s;
  if(s<1){
    g.style.transformOrigin="top left";
    g.style.transform="scale("+s+")";
    wrap.style.width=(nw*s)+"px";wrap.style.height=(nh*s)+"px";
  }
}
function whenReady(fn){
  requestAnimationFrame(fn);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){requestAnimationFrame(fn);});
  setTimeout(fn,400);setTimeout(fn,1100);
}

function icon(name){
  var p={
    export:'<path d="M8 1l3.5 3.5M8 1L4.5 4.5M8 1v10M2 9v5h12V9" fill="none" stroke="currentColor" stroke-width="1.4"/>',
    print:'<path d="M4 6V2h8v4M4 12H2V6h12v6h-2M4 10h8v4H4z" fill="none" stroke="currentColor" stroke-width="1.4"/>',
    copy:'<path d="M5 5V2h9v9h-3M2 5h9v9H2z" fill="none" stroke="currentColor" stroke-width="1.4"/>',
    trash:'<path d="M2 4h12M6 4V2h4v2M4 4l1 10h6l1-10" fill="none" stroke="currentColor" stroke-width="1.4"/>',
    pencil:'<path d="M12 2l4 4-9 9-4 1 1-4 8-8z" fill="none" stroke="currentColor" stroke-width="1.4"/>'
  }[name]||"";
  return '<svg viewBox="0 0 16 16" aria-hidden="true">'+p+'</svg>';
}

function renderCard(recipe,flipped){
  var flip=el("div","flip"+(flipped?" flipped":""));
  var inner=el("div","flip-inner");

  // FRONT — the graph artifact
  var front=el("div","flip-face front");
  var head=el("div","card-head");
  var hn=el("div","ch-name",recipe.title);
  var hb=el("div","ch-bn");hb.innerHTML="Batch no. <b>"+batchNo(recipe)+"</b>";
  head.appendChild(hn);head.appendChild(hb);
  var body=el("div","card-body");
  var gwrap=renderGraph(recipe);
  body.appendChild(gwrap);
  flip._gwrap=gwrap;
  whenReady(function(){fitGraph(gwrap,(flip.clientWidth||480)-32,null);});
  var foot=el("div","card-foot");
  foot.appendChild(el("span",null,recipe.yield||""));

function exportCard(faceEl,name){
  if(!window.html2canvas){toast("Export unavailable");return;}
  toast("Rendering PNG…");
  // temporarily render the graph at full resolution
  var g=faceEl.querySelector(".graph"),wrap=g&&g.parentNode,saved=null;
  if(g&&g.style.transform){
    saved={t:g.style.transform,w:wrap.style.width,h:wrap.style.height};
    g.style.transform="";wrap.style.width="";wrap.style.height="";
  }
  var restore=function(){if(saved){g.style.transform=saved.t;wrap.style.width=saved.w;wrap.style.height=saved.h;}};
  html2canvas(faceEl,{backgroundColor:"#EDE9E3",scale:2,useCORS:true}).then(function(canvas){
    restore();
    var a=document.createElement("a");
    a.download=name+".png";a.href=canvas.toDataURL("image/png");a.click();
    toast("Saved "+a.download);
  }).catch(function(){restore();toast("Export failed");});
}

/* ============================================================ LIBRARY (cascade↔ring layout engine) */
var ringState={tags:[],q:""};
/* zoom/auto-assemble are UI preferences the user toggles — kept at module scope
   so they persist for the session (survive leaving/returning to the library),
   but not written to localStorage. */
var libPrefs={autoScroll:true,zoom:1,autoRotate:true};

/* ---- tunable layout constants (not magic numbers) ---- */
var LAYOUT={
  cardSize:136,        // card width, px, before zoom
  cardAspect:0.74,      // height = cardSize * cardAspect (tall enough that name+tags never clip)
  ringRadius:500,       // px, before zoom
  stepX:44,             // cascade: px between cards, x
  stepY:32,             // cascade: px between cards, y
  rotationOffset:-Math.PI/2,  // ring: initial angle of card 0 (top)
  rotateSpeed:(Math.PI*2)/(75*60),  // rad/frame @60fps — full orbit in ~75s
  pushRadius:250,       // px — cursor push-field falloff distance
  pushStrength:80,      // px — max displacement at zero distance
  centerX:0,centerY:0   // stage-local, recomputed on resize
};
/* live ring rotation angle — advances continuously in tick() (independent of
   scroll/cursor); module-scope so it keeps spinning in place across
   leaving/returning to the library, and holds exactly when paused */
var ringAngle=LAYOUT.rotationOffset;

/* the core positioning function: index + count + mode → {x,y,scale}, all
   stage-local px, relative to LAYOUT.centerX/centerY */
/* the ring is a perfect circle, so its radius is capped to whatever fits
   inside the stage on its shorter axis — LAYOUT.ringRadius is still the
   "ideal" tunable value, this just keeps it from clipping off small/wide
   viewports before zoom is applied on top */
function effRingRadius(){
  var fit=Math.min(LAYOUT.centerX,LAYOUT.centerY)-LAYOUT.cardSize*0.95;
  return Math.max(120,Math.min(LAYOUT.ringRadius,fit))*libPrefs.zoom;
}
function cardPos(i,count,mode){
  if(mode==="cascade"){
    return {
      x:LAYOUT.centerX + i*LAYOUT.stepX*libPrefs.zoom,
      y:LAYOUT.centerY - i*LAYOUT.stepY*libPrefs.zoom,
      scale:1
    };
  }
  var angle=(i/Math.max(count,1))*Math.PI*2 + ringAngle;
  var R=effRingRadius();
  return {
    x:LAYOUT.centerX + R*Math.cos(angle),
    y:LAYOUT.centerY + R*Math.sin(angle),
    scale:1   // frontal ring — no depth falloff, every card reads the same
  };
}
function lerp(a,b,t){return a+(b-a)*t;}
function easeInOutCubic(t){return t<0.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;}

function viewLibrary(root){
  root.appendChild(topbar());
  var view=el("div","ring-view");

  var recipes=DB.recipes.slice();
  var allTags={};
  DB.recipes.forEach(function(r){r.tags.forEach(function(t){allTags[t]=(allTags[t]||0)+1;});});

  function filtered(){
    return recipes.filter(function(r){
      var okTag=!ringState.tags.length||ringState.tags.some(function(t){return r.tags.indexOf(t)>=0;});
      var q=ringState.q.trim().toLowerCase();
      var okQ=!q||(r.title.toLowerCase().indexOf(q)>=0
        ||r.tags.join(" ").toLowerCase().indexOf(q)>=0
        ||(r.ingredients||[]).join(" ").toLowerCase().indexOf(q)>=0);
      return okTag&&okQ;
    });
  }

  var meta=el("div","ring-meta");
  var mc=el("div","count");
  meta.appendChild(mc);
  var reset=el("button","filter-clear","Reset library");
  reset.style.marginTop=".6rem";
  reset.onclick=function(){if(confirm("Replace your library with the sample set?")){DB=seed();save();render();}};
  meta.appendChild(reset);
  view.appendChild(meta);

  var stage=el("div","ring-stage");
  var ring=el("div","ring");
  var preview=el("div","ring-preview");
  ring.appendChild(preview);
  stage.appendChild(ring);
  view.appendChild(stage);

  /* ---- auto-assemble toggle + zoom, near the filter dock ---- */
  var controls=el("div","lib-controls");
  var autoRow=el("div","row");
  autoRow.appendChild(el("span","row-label","Auto-assemble"));
  var toggle=el("button","switch"+(libPrefs.autoScroll?" on":""));
  toggle.type="button";toggle.setAttribute("role","switch");
  toggle.setAttribute("aria-checked",libPrefs.autoScroll?"true":"false");
  toggle.appendChild(el("span","knob"));
  toggle.onclick=function(){
    libPrefs.autoScroll=!libPrefs.autoScroll;
    toggle.classList.toggle("on",libPrefs.autoScroll);
    toggle.setAttribute("aria-checked",libPrefs.autoScroll?"true":"false");
  };
  autoRow.appendChild(toggle);
  controls.appendChild(autoRow);

  var rotRow=el("div","row");
  rotRow.appendChild(el("span","row-label","Auto-rotate"));
  var rotToggle=el("button","switch"+(libPrefs.autoRotate?" on":""));
  rotToggle.type="button";rotToggle.setAttribute("role","switch");
  rotToggle.setAttribute("aria-checked",libPrefs.autoRotate?"true":"false");
  rotToggle.appendChild(el("span","knob"));
  rotToggle.onclick=function(){
    libPrefs.autoRotate=!libPrefs.autoRotate;
    rotToggle.classList.toggle("on",libPrefs.autoRotate);
    rotToggle.setAttribute("aria-checked",libPrefs.autoRotate?"true":"false");
  };
  rotRow.appendChild(rotToggle);
  controls.appendChild(rotRow);

  var zoomRow=el("div","row");
  zoomRow.appendChild(el("span","row-label","Zoom"));
  var zg=el("div","zoom-group");
  var zOut=el("button","zoom-btn","–");zOut.type="button";
  var zLabel=el("span","zoom-label",Math.round(libPrefs.zoom*100)+"%");
  var zIn=el("button","zoom-btn","+");zIn.type="button";
  function setZoom(z){
    libPrefs.zoom=Math.max(0.6,Math.min(1.6,z));
    zLabel.textContent=Math.round(libPrefs.zoom*100)+"%";
  }
  zOut.onclick=function(){setZoom(libPrefs.zoom-0.1);};
  zIn.onclick=function(){setZoom(libPrefs.zoom+0.1);};
  zg.appendChild(zOut);zg.appendChild(zLabel);zg.appendChild(zIn);
  zoomRow.appendChild(zg);
  controls.appendChild(zoomRow);
  view.appendChild(controls);

  /* ---- filter dock — untouched ---- */
  var dock=el("div","filter-dock");
  var h4=el("h4");h4.innerHTML='Filter <span></span>';
  dock.appendChild(h4);
  var search=el("input","tag-search");search.type="search";search.placeholder="search recipes…";
  search.value=ringState.q;
  search.oninput=function(){ringState.q=search.value;paint();};
  dock.appendChild(search);
  var tl=el("div","tag-list");
  dock.appendChild(tl);
  var clr=el("button","filter-clear","Clear filters");
  clr.onclick=function(){ringState.tags=[];ringState.q="";search.value="";paint();};
  dock.appendChild(clr);
  view.appendChild(dock);

  root.appendChild(view);

  function buildTagList(){
    tl.innerHTML="";
    Object.keys(allTags).sort().forEach(function(t){
      var c=el("button","tag-chip"+(ringState.tags.indexOf(t)>=0?" on":""));
      c.innerHTML=t+" <b>"+allTags[t]+"</b>";
      c.onclick=function(){
        var i=ringState.tags.indexOf(t);
        if(i>=0)ringState.tags.splice(i,1);else ringState.tags.push(t);
        paint();
      };
      tl.appendChild(c);
    });
  }

  var cur={list:[]};
  var cardEls={},cardState={};
  var mouse={x:0,y:0,active:false};
  var scroll={progress:0,lastManual:0,autoDir:1};
  function setProgress(p){scroll.progress=Math.max(0,Math.min(1,p));scroll.lastManual=Date.now();}

  function updateCenter(){
    var r=stage.getBoundingClientRect();
    /* bias down a bit so the top of the assembled ring clears the fixed topbar */
    LAYOUT.centerX=r.width/2;LAYOUT.centerY=r.height/2+28;
  }
  updateCenter();

  /* cursor push-field: displacement away from the cursor, falling off with distance */
  function pushOffset(bx,by){
    if(!mouse.active)return {x:0,y:0};
    var dx=bx-mouse.x,dy=by-mouse.y,dist=Math.sqrt(dx*dx+dy*dy);
    if(dist>=LAYOUT.pushRadius||dist<1)return {x:0,y:0};
    var falloff=1-dist/LAYOUT.pushRadius;
    var f=LAYOUT.pushStrength*libPrefs.zoom*falloff;
    return {x:(dx/dist)*f,y:(dy/dist)*f};
  }

  function makeOrbit(r){
    var o=el("div","orbit");o.dataset.id=r.id;
    var card=el("div","idx-card");
    var bn=el("div","bn");bn.innerHTML="Batch no. <b>"+String(DB.recipes.findIndex(function(x){return x.id===r.id;})+1).padStart(3,"0")+"</b>";
    card.appendChild(bn);
    card.appendChild(el("div","nm",r.title));
    card.appendChild(el("div","tg",r.tags.slice(0,3).join(" / ")));
    card.onclick=function(){go("/recipe/"+r.id);};
    card.addEventListener("pointerenter",function(){showPreview(r);});
    card.addEventListener("pointerleave",function(){scheduleHidePreview();});
    o.appendChild(card);
    return o;
  }

  function addCard(r,i){
    var o=makeOrbit(r);
    ring.insertBefore(o,preview);
    var p=cardPos(i,cur.list.length,"cascade");
    cardEls[r.id]=o;
    cardState[r.id]={x:p.x,y:p.y};
    o.style.opacity="0";
    requestAnimationFrame(function(){o.style.opacity="1";});
  }
  function removeCard(id){
    var o=cardEls[id];if(!o)return;
    o.style.opacity="0";
    setTimeout(function(){if(o.parentNode)o.parentNode.removeChild(o);},340);
    delete cardEls[id];delete cardState[id];
  }

  /* ---- center hover-reveal (only once the ring is close to assembled) ---- */
  var hideT=null;
  function showPreview(r){
    if(easeInOutCubic(scroll.progress)<0.75)return;
    clearTimeout(hideT);
    preview.innerHTML="";
    preview.appendChild(el("div","pv-name",r.title));
    var gwrap=renderGraph(r,{mini:true});
    preview.appendChild(gwrap);
    preview.onclick=function(){go("/recipe/"+r.id);};
    preview.classList.add("show");
    whenReady(function(){fitGraph(gwrap,preview.clientWidth-32,220);});
  }
  function hidePreviewNow(){preview.classList.remove("show");}
  function scheduleHidePreview(){clearTimeout(hideT);hideT=setTimeout(hidePreviewNow,90);}

  function showEmpty(){
    Object.keys(cardEls).forEach(removeCard);
    cur.list=[];
    var e=el("div","ring-empty");
    var t=el("div","striped");t.style.fontSize="clamp(1.4rem,5vw,2.6rem)";
    t.textContent=recipes.length?"No matches":"Empty library";
    e.appendChild(t);
    var sub=el("p");sub.style.cssText="max-width:22rem;color:var(--color-ink-soft);font-size:.9rem";
    sub.textContent=recipes.length?"No recipe matches these filters.":"Paste a recipe to generate your first graph.";
    e.appendChild(sub);
    var b=el("button","pill red",recipes.length?"Clear filters":"+ New recipe");
    b.onclick=function(){if(recipes.length){ringState.tags=[];ringState.q="";search.value="";paint();}else go("/new");};
    e.appendChild(b);stage.appendChild(e);
  }

  function paint(){
    var list=filtered();
    h4.querySelector("span").textContent=list.length+" / "+recipes.length;
    mc.textContent=DB.recipes.length+" recipes  ·  "+Object.keys(allTags).length+" labels";
    buildTagList();
    var empty=stage.querySelector(".ring-empty");if(empty)empty.remove();

    if(!list.length){showEmpty();return;}

    var newIds={};list.forEach(function(r){newIds[r.id]=1;});
    Object.keys(cardEls).forEach(function(id){if(!newIds[id])removeCard(id);});
    list.forEach(function(r,i){if(!cardEls[r.id])addCard(r,i);});
    cur.list=list;
  }

  /* ---- render loop: damped-follow toward the lerp(cascade,ring) target + push field ---- */
  var raf=0;
  function tick(){
    /* stop the moment we've navigated away — otherwise this keeps animating
       a detached ring forever in the background */
    if(currentRoute().name!=="library"){raf=0;return;}
    if(libPrefs.autoScroll&&Date.now()-scroll.lastManual>1500){
      scroll.progress+=scroll.autoDir*0.0016;
      if(scroll.progress>=1){scroll.progress=1;scroll.autoDir=-1;}
      else if(scroll.progress<=0){scroll.progress=0;scroll.autoDir=1;}
    }
    if(libPrefs.autoRotate)ringAngle+=LAYOUT.rotateSpeed;
    var ep=easeInOutCubic(scroll.progress);
    var list=cur.list,N=list.length;
    /* the ring/cascade spacing follows zoom all the way down, but the card
       itself keeps a legible floor so its three text rows never clip */
    var CW=Math.max(132,LAYOUT.cardSize*libPrefs.zoom),CH=CW*LAYOUT.cardAspect;
    list.forEach(function(r,i){
      var cs=cardState[r.id],o=cardEls[r.id];if(!cs||!o)return;
      var c1=cardPos(i,N,"cascade"),c2=cardPos(i,N,"ring");
      var bx=lerp(c1.x,c2.x,ep),by=lerp(c1.y,c2.y,ep);
      var push=pushOffset(bx,by);
      var tx=bx+push.x,ty=by+push.y;
      cs.x+=(tx-cs.x)*0.16;cs.y+=(ty-cs.y)*0.16;
      o.style.width=CW+"px";o.style.height=CH+"px";
      o.style.transform="translate3d("+(cs.x-CW/2)+"px,"+(cs.y-CH/2)+"px,0)";
    });
    if(preview.classList.contains("show")&&ep<0.7)hidePreviewNow();
    raf=requestAnimationFrame(tick);
  }
  if(raf)cancelAnimationFrame(raf);
  raf=requestAnimationFrame(tick);

  /* ---- input: wheel assembles/disassembles the ring; cmd/ctrl+wheel zooms;
     drag scrubs progress; arrows nudge it; mouse position drives the push field ---- */
  stage.addEventListener("wheel",function(e){
    if(e.target.closest(".filter-dock")||e.target.closest(".lib-controls"))return;
    e.preventDefault();
    if(e.ctrlKey||e.metaKey){setZoom(libPrefs.zoom-e.deltaY*0.0016);return;}
    setProgress(scroll.progress+e.deltaY*0.0014);
  },{passive:false});

  stage.addEventListener("pointermove",function(e){
    var r=stage.getBoundingClientRect();
    mouse.x=e.clientX-r.left;mouse.y=e.clientY-r.top;mouse.active=true;
  });
  stage.addEventListener("pointerleave",function(){mouse.active=false;});

  var drag=null;
  stage.addEventListener("pointerdown",function(e){
    if(e.target.closest(".filter-dock")||e.target.closest(".lib-controls")||e.target.closest(".idx-card")||e.target.closest(".ring-preview"))return;
    drag={x:e.clientX,y:e.clientY};
  });
  window.addEventListener("pointermove",function(e){
    if(!drag)return;
    var dx=e.clientX-drag.x,dy=e.clientY-drag.y;
    drag.x=e.clientX;drag.y=e.clientY;
    setProgress(scroll.progress-dy*0.0028-dx*0.0006);
  });
  window.addEventListener("pointerup",function(){drag=null;});

  window.addEventListener("keydown",function(e){
    if(currentRoute().name!=="library")return;
    if(e.key==="ArrowUp"||e.key==="ArrowRight")setProgress(scroll.progress+0.12);
    else if(e.key==="ArrowDown"||e.key==="ArrowLeft")setProgress(scroll.progress-0.12);
  });

  var rz;window.addEventListener("resize",function(){
    clearTimeout(rz);rz=setTimeout(function(){if(currentRoute().name==="library")updateCenter();},120);
  });

  paint();
}

    go("/library");
  };
  actions.appendChild(exp);actions.appendChild(pr);actions.appendChild(dup);actions.appendChild(del);
  main.appendChild(actions);
  grid.appendChild(main);

  /* right instructions */
  var right=el("div","rv-instructions");
  var ih=el("div","ih");
  ih.appendChild(el("h2",null,"Instructions"));
  var editBtn=el("button");editBtn.innerHTML=icon("pencil");editBtn.title="edit steps";
  ih.appendChild(editBtn);
  right.appendChild(ih);

  var stepsBox=el("div","rv-steps");
  function paintSteps(){
    stepsBox.innerHTML="";
    if(editingSteps){
      var ta=el("textarea","rv-editsteps");
      ta.value=recipe.steps.join("\n");
      stepsBox.appendChild(ta);
      var savebtn=el("button","pill red","Save steps");savebtn.style.marginTop=".8rem";
      savebtn.onclick=function(){
        recipe.steps=ta.value.split("\n").map(function(s){return s.trim();}).filter(Boolean);
        save();editingSteps=false;
        // re-render card + steps
        cardHost.innerHTML="";cardHost.appendChild(renderCard(recipe,false));
        paintSteps();
        toast("Graph updated");
      };
      stepsBox.appendChild(savebtn);
      var help=el("p");help.style.cssText="font-size:.62rem;color:var(--ink-30);margin-top:.6rem;text-transform:uppercase;letter-spacing:.08em";
      help.textContent="One step per line. The graph regroups ingredients automatically.";
      stepsBox.appendChild(help);
      return;
    }
    recipe.steps.forEach(function(s,i){
      var d=el("div","rv-step");
      d.appendChild(el("div","sn","Step "+(i+1)));
      d.appendChild(el("p",null,s));
      stepsBox.appendChild(d);
    });
  }
  editBtn.onclick=function(){editingSteps=!editingSteps;paintSteps();};
  paintSteps();
  right.appendChild(stepsBox);
  grid.appendChild(right);

  rv.appendChild(grid);

  var nav=el("div","rv-nav");
  var prev=el("button","pill ghost","‹ Previous");
  prev.onclick=function(){editingSteps=false;go("/recipe/"+DB.recipes[(idx-1+DB.recipes.length)%DB.recipes.length].id);};
  var next=el("button","pill ghost","Next ›");
  next.onclick=function(){editingSteps=false;go("/recipe/"+DB.recipes[(idx+1)%DB.recipes.length].id);};
  nav.appendChild(prev);nav.appendChild(next);
  rv.appendChild(nav);

  root.appendChild(rv);
  document.querySelector(".rv-steps").scrollTop=0;
}

/* ============================================================ GENERATOR */
function viewNew(root){
  root.appendChild(topbar());
  var gen=el("div","gen");
  var h=el("h1");var st=el("span","striped");st.textContent="New Recipe";h.appendChild(st);
  gen.appendChild(h);
  var lede=el("p","lede","Paste a recipe below. The generator structures the ingredients and steps into a Cooking-for-Engineers style graph — each process step brackets the ingredients it combines and flows into the next.");
  gen.appendChild(lede);

  var form=el("div","gen-grid");
  function field(label,hint,node){
    var f=el("div","field"+(node.tagName==="TEXTAREA"?" full":""));
    var l=el("label",null,label);
    if(hint){var hs=el("span","hint"," — "+hint);l.appendChild(hs);}
    f.appendChild(l);f.appendChild(node);return f;
  }
  var fTitle=el("input");fTitle.placeholder="Espresso Brownies";
  var fUrl=el("input");fUrl.placeholder="https:// (kept as source link)";fUrl.type="url";
  var fYield=el("input");fYield.placeholder="Makes 16 squares";
  var fTime=el("input");fTime.placeholder="50 min";
  var fTags=el("input");fTags.placeholder="dessert, chocolate, weekend";
  var fIng=el("textarea");fIng.placeholder="4 oz unsalted butter\n1 cup sugar\n1/4 tsp vanilla extract\n2 large eggs\n1/2 cup all-purpose flour\n1/3 cup cocoa powder";
  var fSteps=el("textarea");fSteps.placeholder="Preheat oven to 350°F\nMelt the butter\nMix in the sugar and vanilla\nMix in the eggs\nWhisk the flour and cocoa in a separate bowl\nFold the dry into the wet\nBake at 350°F for 30 to 40 minutes";

  form.appendChild(field("Title","",fTitle));
  form.appendChild(field("Source URL","optional",fUrl));
  form.appendChild(field("Yield","",fYield));
  form.appendChild(field("Total time","",fTime));
  form.appendChild(field("Labels","comma separated",fTags));
  var sp=el("div","field");form.appendChild(sp);
  form.appendChild(field("Ingredients","one per line, with quantities",fIng));
  form.appendChild(field("Steps","one step per line",fSteps));
  gen.appendChild(form);

  var preview=el("div","gen-preview");
  preview.appendChild(el("div","u-label","Live graph preview"));
  var pv=el("div");preview.appendChild(pv);
  gen.appendChild(preview);

  function draft(){
    return {
      id:"draft",title:fTitle.value.trim()||"Untitled recipe",sourceUrl:fUrl.value.trim(),
      yield:fYield.value.trim(),totalTime:fTime.value.trim(),activeTime:"",
      tags:fTags.value.split(",").map(function(s){return s.trim().toLowerCase();}).filter(Boolean),
      ingredients:fIng.value.split("\n").map(function(s){return s.trim();}).filter(Boolean),
      steps:fSteps.value.split("\n").map(function(s){return s.trim();}).filter(Boolean)
    };
  }
  function paintPreview(){
    pv.innerHTML="";
    var d=draft();
    if(!d.ingredients.length||!d.steps.length){
      var p=el("p");p.style.cssText="color:var(--ink-30);font-size:.75rem";
      p.textContent="Add ingredients and steps to see the graph.";
      pv.appendChild(p);return;
    }
    try{pv.appendChild(renderGraph(d));}catch(e){
      var er=el("p");er.style.color="var(--red)";er.textContent="Could not build graph from this input.";pv.appendChild(er);
    }
  }
  [fTitle,fUrl,fYield,fTime,fTags,fIng,fSteps].forEach(function(n){n.addEventListener("input",paintPreview);});
  paintPreview();

  var act=el("div","gen-actions");
  var gen1=el("button","pill red","Generate graph →");
  gen1.onclick=function(){
    var d=draft();
    if(!d.ingredients.length||!d.steps.length){toast("Need ingredients and steps");return;}
    d.id=uid();d.createdAt=Date.now();
    DB.recipes.push(d);save();
    go("/recipe/"+d.id);
  };
  var samp=el("button","pill ghost","Fill sample");
  samp.onclick=function(){
    fTitle.value="Espresso Brownies";fYield.value="Makes 16 squares";fTime.value="50 min";
    fTags.value="dessert, chocolate, weekend";
    fIng.value="4 oz unsalted butter\n1 cup sugar\n1/4 tsp vanilla extract\n1 shot fresh brewed espresso\n2 large eggs\n1/2 cup all-purpose flour\n1/3 cup cocoa powder\n1/4 tsp baking soda\n1/4 tsp table salt";
    fSteps.value="Butter and flour an 8x8-in pan\nPreheat oven to 350°F (170°C)\nMelt the butter\nMix in the sugar, vanilla, and espresso\nMix in the eggs\nWhisk together the flour, cocoa powder, baking soda, and salt in a separate bowl\nFold the dry ingredients into the wet\nBake at 350°F for 30 to 40 minutes";
    paintPreview();
  };
  var cancel=el("button","pill ghost","Cancel");
  cancel.onclick=function(){go("/library");};
  act.appendChild(gen1);act.appendChild(samp);act.appendChild(cancel);
  gen.appendChild(act);

  root.appendChild(gen);
}

/* ============================================================ render */
function render(){
  var root=document.getElementById("app");
  root.innerHTML="";
  var r=currentRoute();
  if(r.name==="library")viewLibrary(root);
  else if(r.name==="new")viewNew(root);
  else if(r.name==="recipe")viewRecipe(root,r.id);
  window.scrollTo(0,0);
}
})();
</script>
</body>
</html>
